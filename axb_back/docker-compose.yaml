services:
  mysql:
    image: mysql:latest
    container_name: shop-mysql
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: ivan
      MYSQL_PASSWORD: 123456
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
